<!doctype html>
<!--
  `lang` starts as the i18n default and is rewritten at runtime by main.tsx,
  next to where it sets `dir`. A static lang="en" told every screen reader to
  pronounce the Hebrew UI with English phonetics.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.ico" />
    <!-- No viewport-fit=cover: in the Android app it tells Capacitor's SystemBars
         (WebView 140+) to stop padding the WebView and draw under the status
         and navigation bars, which cut off the app bar and the bottom nav on
         a real phone. Without it Capacitor keeps the app inside the bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

    <title>FitAi — Training &amp; Nutrition Planning</title>
    <meta
      name="description"
      content="Plan workouts and nutrition, log every set, track measurements, and share progress with your trainer."
    />
    <!-- One per scheme, matching the header surface (--color-background) rather
         than the brand colour, so the browser chrome blends into the app bar. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0e12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Without these, every link shared to WhatsApp or LinkedIn renders as a
         bare URL. The image is the only logo actually referenced by the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitAi" />
    <meta property="og:title" content="FitAi — Training &amp; Nutrition Planning" />
    <meta
      property="og:description"
      content="Plan workouts and nutrition, log every set, track measurements, and share progress with your trainer."
    />
    <meta property="og:image" content="/assets/fitai_logo_transparent.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitAi — Training &amp; Nutrition Planning" />
    <meta
      name="twitter:description"
      content="Plan workouts and nutrition, log every set, track measurements, and share progress with your trainer."
    />
    <meta name="twitter:image" content="/assets/fitai_logo_transparent.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
