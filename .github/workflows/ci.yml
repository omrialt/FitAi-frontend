# Nothing checked this repo before a deploy. Deploys are push-to-deploy
# straight to Vercel, so a type error or a broken build only surfaced once it
# was live.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Blocking since the baseline was cleared (gap analysis rev. 17). It was
      # non-blocking while a standing baseline would have made every PR red on
      # day one; with zero, a new problem is a new problem.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Runs `tsc -b` before vite build, so this is the type check too.
      - name: Build
        run: npm run build
